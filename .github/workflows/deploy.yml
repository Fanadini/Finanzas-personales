name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/expense-tracker-app-2ofla
      - main
  schedule:
    # Cada 15 min en horario de mercado de EE. UU. (13:30–21:00 UTC, lun–vie) + cierre
    - cron: '*/15 13-20 * * 1-5'
    - cron: '20 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scan S&P 500 (order blocks / liquidez)
        run: node scripts/scan.mjs dist/data

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
